[PHP]
; Reportar errores excluyendo deprecaciones y avisos para compatibilidad con PHP 8.4+ y 8.5+
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
display_errors = Off
display_startup_errors = Off
log_errors = On

; Parámetros de memoria y subida de archivos
memory_limit = 512M
post_max_size = 64M
upload_max_filesize = 64M
max_execution_time = 300

; Zona horaria
date.timezone = America/Bogota
