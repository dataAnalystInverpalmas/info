version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: info-app:php82
    container_name: php_web
    restart: always
    ports:
      - "9258:80"
    environment:
      # Valores dinámicos leídos automáticamente desde .env
      API_SECRET_TOKEN: "${API_SECRET_TOKEN:-9035232260ca3fc11faa82b6b32b20605fe55c242e6903ca2f7e0887c3e9be17}"
      DB_HOST: "${DB_HOST:-172.10.18.128}"
      DB_NAME: "${DB_NAME:-informes}"
      DB_USER: "${DB_USER:-root}"
      DB_PASS: "${DB_PASS:-AdmSys2014}"
      DB_PORT: "${DB_PORT:-3306}"
      PYTHON_API_URL: "${PYTHON_API_URL:-http://python_api:8000}"
    volumes:
      - .:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - db
      - python_api

    networks:
      - proyecto-net

  python_api:
    build:
      context: ./python_service
      dockerfile: Dockerfile
    image: info-app:python312
    container_name: python_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      API_SECRET_TOKEN: "${API_SECRET_TOKEN:-9035232260ca3fc11faa82b6b32b20605fe55c242e6903ca2f7e0887c3e9be17}"
      DB_HOST: "${DB_HOST:-172.10.18.128}"
      DB_NAME: "${DB_NAME:-informes}"
      DB_USER: "${DB_USER:-root}"
      DB_PASS: "${DB_PASS:-AdmSys2014}"
      DB_PORT: "${DB_PORT:-3306}"
    volumes:
      - ./python_service/app:/app/app
    depends_on:
      - db
    networks:
      - proyecto-net

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: AdmSys2014
      MYSQL_DATABASE: info
      MYSQL_USER: admin
      MYSQL_PASSWORD: AdmSys2014
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - proyecto-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: AdmSys2014
    ports:
      - "8081:80"
    networks:
      - proyecto-net

networks:
  proyecto-net:

volumes:
  db_data:
